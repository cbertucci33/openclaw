# Temporary installed-validator proof for PR154892. Remove before landing.
name: Installed update validator proof
on:
  push:
    branches: [fix/update-config-validation-failures]
    paths: [.github/workflows/update-validator-proof.yml]
permissions:
  contents: read
concurrency:
  group: installed-update-validator-${{ github.ref }}
  cancel-in-progress: false
jobs:
  published-updater:
    if: github.repository == 'openclaw/openclaw'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 120
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      SOURCE_SHA: 913c3a49df8c89503d1ebbe0d2d1718d345f113d
      SOURCE_TREE: 2308b16a24f1e9cecab802f6cb2770fc2f445e65
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - name: Separate the disposable harness from the sealed product source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "31e225f770499d7f373f6d46e904f960d0dd5805"
          test "$(git rev-parse HEAD^1^{tree})" = "b1547f9b1150ce71a6398435cea477071cc9bc0e"
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$SOURCE_TREE"
          test -z "$(git status --porcelain)"
          actual="$(git diff --name-only "$SOURCE_SHA" HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' .github/workflows/update-validator-proof.yml scripts/e2e/lib/upgrade-survivor/update-first-hop-compat.sh scripts/e2e/lib/upgrade-survivor/update-validator-proof.mjs | LC_ALL=C sort)"
          test "$actual" = "$expected"
          mkdir "$RUNNER_TEMP/validator-harness" "$RUNNER_TEMP/validator-proof"
          cp scripts/e2e/lib/upgrade-survivor/update-first-hop-compat.sh "$RUNNER_TEMP/validator-harness/"
          cp scripts/e2e/lib/upgrade-survivor/update-validator-proof.mjs "$RUNNER_TEMP/validator-harness/"
          sha256sum "$RUNNER_TEMP/validator-harness/"* > "$RUNNER_TEMP/validator-proof/harness.sha256"
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test -z "$(git status --porcelain)"
          printf 'carrier=%s\nsource=%s\ntree=%s\n' "$GITHUB_SHA" "$SOURCE_SHA" "$SOURCE_TREE"
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.x"
          install-bun: false
          cache-mode: "off"
          install-deps: true
          frozen-lockfile: true
      - name: Build and seal the canonical candidate before installing the proof harness
        shell: bash
        run: |
          set -euo pipefail
          node --version
          pnpm --version
          node scripts/package-openclaw-for-docker.mjs --allow-unreleased-changelog \
            --output-dir "$RUNNER_TEMP/candidate-package" --output-name candidate.tgz \
            --pack-json "$RUNNER_TEMP/validator-proof/candidate-pack.json"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          node "$RUNNER_TEMP/validator-harness/update-validator-proof.mjs" seal \
            "$RUNNER_TEMP/candidate-package/candidate.tgz" \
            "$RUNNER_TEMP/validator-proof/validator-proof-input.json"
          sha256sum "$RUNNER_TEMP/candidate-package/candidate.tgz" > "$RUNNER_TEMP/validator-proof/candidate.sha256"
          sha256sum --check "$RUNNER_TEMP/validator-proof/harness.sha256"
          cp "$RUNNER_TEMP/validator-harness/"* scripts/e2e/lib/upgrade-survivor/
      - name: Authenticate the published 9.4 driver and run the existing first-hop lane
        shell: bash
        env:
          OPENCLAW_QA_ALLOW_UPDATE_FIRST_HOP: "1"
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/published-driver"
          npm pack openclaw@2026.9.4 --ignore-scripts --json --min-release-age=0 \
            --pack-destination "$RUNNER_TEMP/published-driver" > "$RUNNER_TEMP/validator-proof/source-pack.json"
          filename="$(node -e 'const fs=require("node:fs"), a=JSON.parse(fs.readFileSync(process.argv[1])); if(a.length!==1 || !/^[a-z0-9.-]+\.tgz$/.test(a[0].filename)) process.exit(1); console.log(a[0].filename)' "$RUNNER_TEMP/validator-proof/source-pack.json")"
          export OPENCLAW_UPDATE_FIRST_HOP_ARTIFACT_DIR="$RUNNER_TEMP/validator-proof"
          export OPENCLAW_UPDATE_FIRST_HOP_SOURCE_PACKAGE_TGZ="$RUNNER_TEMP/published-driver/$filename"
          export OPENCLAW_UPDATE_FIRST_HOP_CANDIDATE_PACKAGE_TGZ="$RUNNER_TEMP/candidate-package/candidate.tgz"
          # The canonical fixture helper authenticates the published tarball
          # against the candidate's recorded released-version integrity.
          bash scripts/e2e/update-first-hop-compat-docker.sh
          sha256sum --check "$RUNNER_TEMP/validator-proof/candidate.sha256"
          node -e 'const fs=require("node:fs"), root=process.argv[1], s=JSON.parse(fs.readFileSync(root+"/summary.json")), v=JSON.parse(fs.readFileSync(root+"/validator-proof-receipt.json")), u=JSON.parse(fs.readFileSync(root+"/validator-unit-restored.json")); if(s.firstHop.exit!==0 || s.secondHop.exit!==0 || v.targetHitCount!==1 || v.parentExit!==1 || u.restored!==true) process.exit(1); console.log(JSON.stringify({positiveHops:2,validator:v,unitRestoration:u},null,2))' "$RUNNER_TEMP/validator-proof"
      - name: Retain exact proof receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: installed-validator-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/validator-proof/validator-proof-input.json
            ${{ runner.temp }}/validator-proof/validator-proof-receipt.json
            ${{ runner.temp }}/validator-proof/validator-hit.json
            ${{ runner.temp }}/validator-proof/validator-duplicate.json
            ${{ runner.temp }}/validator-proof/validator-unit-restored.json
            ${{ runner.temp }}/validator-proof/validator-update.stdout
            ${{ runner.temp }}/validator-proof/validator-update.stderr
            ${{ runner.temp }}/validator-proof/validator-update.exit
            ${{ runner.temp }}/validator-proof/validator-report.md
            ${{ runner.temp }}/validator-proof/summary.json
            ${{ runner.temp }}/validator-proof/source.json
            ${{ runner.temp }}/validator-proof/*-pack.json
            ${{ runner.temp }}/validator-proof/*.sha256
